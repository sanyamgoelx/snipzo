# Builds Snipzo for Windows and macOS on every push, tests it, and publishes a release for a v* tag.
#  - test:   the end-to-end test under Xvfb (fake windows, x11grab, fed sound) + the snapping bench
#  - build:  Windows portable exe, Mac .dmg/.zip for Apple silicon and Intel; then a smoke check runs INSIDE
#            each built app (SNIPZO_SMOKE=1: display list, screen -> ffmpeg device, window list, encoders,
#            file clipboard round trip, keyboard hook thread on Windows), and the Mac app's signature and
#            .dmg contents are checked
#  - release: only for tags v*, only when everything above passed; uploads exactly the files that were tested
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions: { contents: write } # only to push the screenshots of a failed run to the ci-shots branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb xcompmgr ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Snapping bench
        run: bash ci/step.sh "Snapping bench" node test/content-bench.js
      - name: End-to-end test (Xvfb)
        run: |
          bash ci/step.sh "End-to-end test" bash -c "bash test/run.sh | tee test-output.txt"
          bash ci/step.sh "End-to-end results" node ci/check-results.js /tmp/snipzo-shots/results.json
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: test-screenshots, path: /tmp/snipzo-shots }
      # Screenshots of a failed run on a branch, so they can be fetched with git (artifacts need a storage host)
      - name: Push screenshots of a failed run
        if: failure()
        run: |
          D=$(mktemp -d); cp -r /tmp/snipzo-shots/. "$D"/ 2>/dev/null || true; cp test-output.txt "$D"/ 2>/dev/null || true
          cd "$D" && git init -q && git checkout -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "screenshots of run ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: mac-arm64, os: macos-14, arch: arm64 }
          - { name: mac-x64, os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Install
        shell: bash
        run: bash ci/step.sh "npm ci" npm ci --no-audit --no-fund

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash ci/step.sh "Build (Windows)" npx electron-builder --win portable --x64 --publish never
      - name: Smoke check inside the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SNIPZO_SMOKE = '1'
          $p = Start-Process -FilePath "dist\win-unpacked\Snipzo.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "smoke run timed out" }
          $f = Join-Path $env:TEMP 'snipzo-smoke.txt'
          Get-Content $f
          $n = ((Get-Content $f | Where-Object { $_ -like 'SMOKE*' } | ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) } else { $_ } }) -join '%0A')
          Write-Host "::notice title=Smoke check (windows)::$n"
          if (-not (Select-String -Path $f -Pattern 'SMOKE OK' -Quiet)) {
            $t = ((Get-Content $f -Tail 60) -join '%0A') -replace '\r', ''
            Write-Host "::error title=Smoke check (Windows)::$t"
            exit 1
          }

      # XProtect can hold the .dmg image open on GitHub's Macs (seen with Convertino)
      - name: Build (Mac)
        if: runner.os == 'macOS'
        env: { USE_HARD_LINKS: 'false' } # electron-builder's hard links gave EEXIST on an unpacked file
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          bash ci/step.sh "Build (Mac, try 1)" npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never || { sleep 5; sudo pkill -9 XProtect >/dev/null 2>&1 || true; bash ci/step.sh "Build (Mac, try 2)" npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never; }
      - name: Check the Mac app (signature, architecture, .dmg contents)
        if: runner.os == 'macOS'
        run: bash ci/step.sh "Check the Mac app" bash ci/check-mac.sh
      - name: Smoke check inside the built app (Mac)
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -maxdepth 2 -name Snipzo.app -type d | head -1)
          SNIPZO_SMOKE=1 "$APP/Contents/MacOS/Snipzo" > smoke.txt 2>&1 &
          PID=$!; for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          grep SMOKE smoke.txt || cat smoke.txt
          echo "::notice title=Smoke check (${{ matrix.name }})::$(grep SMOKE smoke.txt | cut -c1-400 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          grep -q 'SMOKE OK' smoke.txt || { bash ci/step.sh "Smoke check (Mac)" bash -c 'tail -n 60 smoke.txt; exit 1'; }

      - uses: actions/upload-artifact@v5
        with:
          name: snipzo-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: out, pattern: snipzo-*, merge-multiple: true }
      - name: Publish the tested files
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          ls -la out
          V="${GITHUB_REF_NAME#v}"
          test -f "out/Snipzo-Portable-$V.exe" && test -f "out/Snipzo-$V-mac-arm64.dmg" && test -f "out/Snipzo-$V-mac-x64.dmg"
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" out/* --title "Snipzo $V" --notes-file ci/release-notes.md
