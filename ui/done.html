<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:">
<title>Snipzo</title>
<link rel="stylesheet" href="snipzo.css">
<style>
html, body { margin: 0; background: transparent; overflow: hidden; font: 13px/1.45 var(--sans); color: var(--text); }
#card { margin: 0; background: var(--panel); border: 1px solid var(--line-hi); border-radius: 12px; overflow: hidden; }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--raise); display: grid; place-items: center; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.thumb .dur { position: absolute; right: 8px; bottom: 8px; font: 600 11px var(--mono); background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 4px; }
.thumb .play { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
.thumb .play::after { content: ""; border-left: 12px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
.x { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 6px; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; z-index: 2; }
.info { padding: 10px 12px 2px; display: grid; gap: 3px; }
.st { display: flex; gap: 7px; align-items: center; font-weight: 600; font-size: 13px; }
.st::before { content: ""; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; flex: none; }
.st.good { color: var(--good); } .st.good::before { content: "✓"; background: var(--good-dim); }
.st.warn { color: var(--warn); } .st.warn::before { content: "!"; background: var(--warn-dim); }
.st.bad { color: var(--rec); } .st.bad::before { content: "!"; background: var(--rec-dim); }
.st.plain { color: var(--text); } .st.plain::before { display: none; }
.meta { font: 500 11.5px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.path { font: 500 11px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.why { color: var(--dim); font-size: 12.5px; }
.notes { margin: 4px 0 0; padding: 0 0 0 16px; color: var(--warn); font-size: 12px; display: grid; gap: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px 12px; }
.acts .btn { padding: 5px 10px; }
.msg { font-size: 12px; color: var(--dim); padding: 0 12px 10px; }
.msg:empty { display: none; }
</style>
</head>
<body>
<div id="card"></div>
<script>
'use strict';
const card = document.getElementById('card');
let D = null;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtB = (b) => (b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB');
const fmtD = (s) => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; };

function render(extra = '') {
  if (!D) return;
  if (D.held) {
    card.innerHTML = `<button class="x" id="x" title="Close">×</button>
      <div class="info"><span class="st plain">Moved to the Holding Area</span>
      <span class="path">&lrm;${esc(D.held)}</span>
      <span class="why">Drive Cleanup can empty it, or you can put the snip back.${D.clipStale ? ' The clipboard still points at the old place, so pasting it now won\'t work.' : ''}</span></div>
      <div class="acts"><button class="btn ghost" id="undo">Put it back</button></div><div class="msg" id="msg">${extra}</div>`;
  } else if (D.ok) {
    const i = D.info, v = i.video || {};
    const copy = D.copy == null ? { cls: 'plain', text: 'Saved' } : D.copy.ok ? { cls: 'good', text: 'Copied to clipboard as a file' } : { cls: 'warn', text: `Saved, not copied: ${D.copy.why}` };
    card.innerHTML = `<div class="thumb" id="play" title="Open">${D.thumb ? `<img alt="" src="${D.thumb}">` : ''}<span class="play"></span><span class="dur">${fmtD(i.duration)}</span><button class="x" id="x" title="Close">×</button></div>
      <div class="info"><span class="st ${copy.cls}">${esc(copy.text)}</span>
      <span class="meta">${fmtD(i.duration)} · ${v.width} × ${v.height} · ${v.fps ? Math.round(v.fps) + ' fps' : ''} · ${fmtB(i.size)}${i.sound ? '' : ' · no sound'}</span>
      <span class="path" title="${esc(D.file)}">&lrm;${esc(D.file)}</span>
      ${(D.notes || []).length ? `<ul class="notes">${D.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>
      <div class="acts"><button class="btn ghost" id="open">Open</button><button class="btn ghost" id="show">Show in folder</button>
      ${D.copy && !D.copy.ok ? '<button class="btn ghost" id="copy">Copy again</button>' : ''}<button class="btn danger" id="discard">Discard</button></div><div class="msg" id="msg">${extra}</div>`;
  } else if (D.stopped) { // a stop is never shown as a failure
    card.innerHTML = `<button class="x" id="x" title="Close" style="position:relative;float:right;margin:6px 6px 0 0">×</button>
      <div class="info"><span class="st plain">Not recorded</span><span class="why">${esc(D.why)}</span></div><div class="acts"></div><div class="msg" id="msg">${extra}</div>`;
  } else {
    card.innerHTML = `<button class="x" id="x" title="Close" style="position:relative;float:right;margin:6px 6px 0 0">×</button>
      <div class="info"><span class="st bad">Recording failed</span><span class="why">${esc(D.why)}</span>
      ${D.file ? `<span class="path">&lrm;${esc(D.file)}</span>` : ''}
      ${D.kept ? `<span class="why">The raw recording is kept in <span class="path" style="display:inline">${esc(D.kept)}</span></span>` : ''}
      ${(D.notes || []).length ? `<ul class="notes">${D.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>
      <div class="acts">${D.kept ? '<button class="btn ghost" id="raw">Show raw files</button>' : ''}${D.file ? '<button class="btn ghost" id="show">Show in folder</button>' : ''}<button class="btn ghost" id="details">Copy details</button></div><div class="msg" id="msg">${extra}</div>`;
  }
  wire();
  requestAnimationFrame(() => snz.send('snz:done-size', { h: card.offsetHeight }));
}
const msg = (t) => render(esc(t));
function wire() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = (e) => { e.stopPropagation(); fn(); }; };
  on('x', () => snz.send('snz:done-close'));
  on('play', async () => { const r = await snz.invoke('snz:open', D.file); if (r.ok) snz.send('snz:done-close'); else msg(r.why); });
  on('open', async () => { const r = await snz.invoke('snz:open', D.file); if (r.ok) snz.send('snz:done-close'); else msg(r.why); });
  on('show', async () => { const r = await snz.invoke('snz:show', D.file); if (r.ok) snz.send('snz:done-close'); else msg(r.why); });
  on('raw', async () => { const r = await snz.invoke('snz:show-dir', D.kept); if (!r.ok) msg(r.why); });
  on('copy', async () => { const r = await snz.invoke('snz:copy-again', D.file); D.copy = r; render(); });
  on('discard', async () => { const r = await snz.invoke('snz:discard', D.file); if (r.ok) { D.held = r.held; D.clipStale = !!r.clipStale; render(); } else msg(`Couldn't discard: ${r.why}`); });
  on('undo', async () => { const r = await snz.invoke('snz:undo-discard', D.file); if (r.ok) { D.held = null; render('Put back in its folder.'); } else msg(`Couldn't put it back: ${r.why}`); });
  on('details', async () => { const t = await snz.invoke('snz:log-text'); try { await navigator.clipboard.writeText(`Snipzo: ${D.why}\n\n${t}`); msg('Copied the details.'); } catch { msg('Could not copy the details.'); } });
}
card.addEventListener('mouseenter', () => snz.send('snz:done-hover', true));
card.addEventListener('mouseleave', () => snz.send('snz:done-hover', false));
snz.on('snz:done', (d) => { D = d; render(); });
</script>
</body>
</html>
