<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Snipzo recording</title>
<link rel="stylesheet" href="snipzo.css">
<style>
html, body { margin: 0; background: transparent; overflow: hidden; font: 13px/1.3 var(--sans); color: var(--text); user-select: none; }
#bar { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px; margin: 2px; background: var(--panel); border: 1px solid var(--line-hi); border-radius: 10px; white-space: nowrap; -webkit-app-region: drag; }
#bar button { -webkit-app-region: no-drag; }
.live { display: inline-flex; align-items: center; gap: 7px; font: 600 12.5px var(--mono); font-variant-numeric: tabular-nums; min-width: 74px; }
.live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.live.on::before { background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
.meter { display: inline-flex; gap: 2px; align-items: end; height: 14px; width: 23px; }
.meter i { width: 3px; height: 2px; background: var(--line-hi); border-radius: 1px; display: block; }
.meter i.lit { background: var(--good); }
.meter i.hot { background: var(--warn); }
.size { font: 500 11.5px var(--mono); color: var(--faint); min-width: 54px; font-variant-numeric: tabular-nums; }
.btn { padding: 5px 10px; }
#mute[aria-pressed="true"] { color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.key { color: rgba(255,255,255,.75); font-weight: 500; font-size: 11px; }
.live.wait::before { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.armed { font-size: 12px; color: var(--dim); }
.armed b { color: var(--text); font-weight: 600; }
.armed kbd { font: 600 11px var(--mono); color: var(--text); border: 1px solid var(--line-hi); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live.on::before { animation: none; } }
</style>
</head>
<body>
<div id="bar">
  <span class="live" id="time">Starting</span>
  <span class="armed" id="armed" hidden></span>
  <span class="meter" id="meter" title="Sound reaching the recording" hidden><i></i><i></i><i></i><i></i><i></i></span>
  <span class="size" id="size" title="Recorded so far, on disk"></span>
  <button class="btn ghost" id="mute" type="button" aria-pressed="false" hidden>Mute mic</button>
  <button class="btn rec" id="stop" type="button">Stop <span class="key" id="key"></span></button>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let S = { phase: 'starting', startedAt: null }, bars = [...document.querySelectorAll('#meter i')];
const fmtT = (ms) => { const t = Math.max(0, ms) / 1000, m = Math.floor(t / 60), s = Math.floor(t % 60); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${Math.floor((t * 10) % 10)}`; };
const fmtB = (b) => (b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB');
function draw() {
  const t = $('time');
  const a = $('armed');
  a.hidden = !S.waitKey || S.phase === 'saving';
  if (S.waitKey) a.innerHTML = S.phase === 'armed' ? 'Press <kbd>Space</kbd> in your app to start' : S.phase === 'recording' ? `<kbd>${S.keyName || 'Space'}</kbd> again stops` : 'Wait, getting ready';
  $('stop').firstChild.textContent = S.waitKey && S.phase !== 'recording' ? 'Cancel ' : 'Stop ';
  if (S.phase === 'countdown') { t.textContent = `Starting in ${S.n}`; t.className = 'live'; }
  else if (S.phase === 'saving') { t.textContent = S.waitKey ? 'Cutting and saving…' : 'Saving…'; t.className = 'live'; $('stop').disabled = true; }
  else if (S.phase === 'armed') { t.textContent = 'Ready'; t.className = 'live wait'; }
  else if (S.startedAt) { t.textContent = fmtT(Date.now() - S.startedAt); t.className = 'live on'; }
  else { t.textContent = 'Starting'; t.className = 'live'; }
  $('meter').hidden = !S.sound;
  $('mute').hidden = !S.mic;
  if (S.mic) { $('mute').setAttribute('aria-pressed', S.mic.muted ? 'true' : 'false'); $('mute').textContent = S.mic.muted ? 'Mic muted' : 'Mute mic'; }
  $('key').textContent = S.hotkey ? S.hotkey : '';
  fit();
}
function fit() { const b = $('bar'); snz.send('snz:bar-size', { w: b.offsetWidth + 6 }); }
snz.on('snz:bar', (m) => {
  if ('meter' in m) { const n = Math.min(5, Math.round(Math.sqrt(m.meter) * 6)); bars.forEach((b, i) => { b.className = i < n ? (i >= 4 ? 'hot' : 'lit') : ''; b.style.height = i < n ? (4 + i * 2.5) + 'px' : '2px'; }); return; }
  if ('bytes' in m && Object.keys(m).length === 1) { $('size').textContent = fmtB(m.bytes); return; }
  Object.assign(S, m); draw();
});
setInterval(() => { if (S.startedAt && S.phase === 'recording') $('time').textContent = fmtT(Date.now() - S.startedAt); }, 100);
$('stop').onclick = () => snz.send('snz:stop');
$('mute').onclick = () => snz.send('snz:mute-mic', !(S.mic && S.mic.muted));
draw();
</script>
</body>
</html>
